name: Backend CI

on:
  push:
    branches: [integration/v1]
  pull_request:
    branches: [integration/v1]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run Alembic migrations
        run: |
          python -m douyin_knowledge.cli db upgrade
        env:
          DK_DATA_DIR: ./test_data
          DK_AI_PROVIDER: mock
          DK_CAPTURE_PROVIDER: fixture

      - name: Run pytest
        run: |
          python -m pytest -q
        env:
          DK_AI_PROVIDER: mock
          DK_CAPTURE_PROVIDER: fixture

      - name: Run ruff
        run: |
          python -m ruff check src tests

      - name: Run mypy
        run: |
          python -m mypy src

      - name: Verify demo mode sync
        run: |
          python -m douyin_knowledge.cli sync --process --wait
          python -m douyin_knowledge.cli ask "我收藏里有哪家茶餐厅" > /tmp/answer.txt
          if ! grep -q "\[1\]" /tmp/answer.txt; then
            echo "ERROR: Answer contains no citations"
            cat /tmp/answer.txt
            exit 1
          fi
          echo "Demo mode sync and cited answer verified"
        env:
          DK_DATA_DIR: ./demo_data
          DK_AI_PROVIDER: mock
          DK_CAPTURE_PROVIDER: fixture
