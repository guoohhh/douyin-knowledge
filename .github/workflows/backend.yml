name: Backend CI

on:
  push:
    branches: [integration/v1]
  pull_request:
    branches: [integration/v1]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ruff and mypy are interpreter-independent here: `[tool.mypy] python_version = "3.12"`
  # pins the checked semantics in pyproject.toml, so running these across the version
  # matrix would burn a second runner to recompute a byte-identical result.
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: ruff
        # `.` rather than `src tests`, to match the gate line in README.md and to cover
        # `migrations/` and the repo's helper scripts. Verified clean at both scopes.
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy src

  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The ends of the supported range in pyproject.toml (`requires-python = ">=3.10"`).
        python-version: ['3.10', '3.12']

    defaults:
      run:
        working-directory: backend

    # Demo mode is the shipped default and the only credential-free configuration, so CI
    # runs the product the way a new user first runs it. No DK_OPENAI_API_KEY, no Douyin
    # cookie, no sidecar: if any step here needs one, that is the bug.
    env:
      DK_AI_PROVIDER: mock
      DK_CAPTURE_PROVIDER: fixture

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: pytest
        run: python -m pytest -q

      - name: Alembic migrates an empty database
        # Asserts the table count rather than the exit code. `db upgrade` prints the head
        # revision and exits 0 even when it has applied nothing, so the exit code alone
        # cannot tell "migrated 52 tables" from "opened an empty file and wrote a version
        # stamp" -- and the second one only fails later, as `no such table: jobs`.
        run: |
          set -euo pipefail
          rm -rf ./ci_migrate_data
          DK_DATA_DIR=./ci_migrate_data python -m douyin_knowledge.cli db upgrade
          DK_DATA_DIR=./ci_migrate_data python - <<'PY'
          import sqlite3, sys
          rows = sqlite3.connect("ci_migrate_data/app.db").execute(
              "SELECT name FROM sqlite_master WHERE type='table'"
          ).fetchall()
          names = {r[0] for r in rows}
          missing = {"alembic_version", "sources", "jobs", "processing_runs", "claims"} - names
          if missing:
              sys.exit(f"migration left the schema incomplete, missing: {sorted(missing)}")
          print(f"migrated {len(names)} tables from an empty database")
          PY

      - name: Demo smoke test produces a cited answer
        # The same data dir it just migrated. Pointing this at a fresh directory is how the
        # first version of this workflow broke: an unmigrated dir is an empty database, and
        # the failure surfaces as `no such table: jobs` several steps from its cause.
        run: |
          set -euo pipefail
          export DK_DATA_DIR=./ci_migrate_data
          python -m douyin_knowledge.cli sync --process --wait | tee /tmp/sync.txt
          grep -qx 'jobs_failed: 0' /tmp/sync.txt || { echo "::error::a processing job failed in demo mode"; exit 1; }
          python -m douyin_knowledge.cli ask "我收藏里有哪家茶餐厅" | tee /tmp/answer.txt
          # An uncited answer is a product defect, not a formatting quirk (DEC-006), so the
          # marker is the assertion. Any ordinal, because which sources rank highest is a
          # retrieval detail that may legitimately change.
          grep -qE '\[[0-9]+\]' /tmp/answer.txt || { echo "::error::answer carried no citation markers"; exit 1; }
