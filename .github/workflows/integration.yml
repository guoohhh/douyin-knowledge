name: Integration Smoke

on:
  push:
    branches: [integration/v1]
  pull_request:
    branches: [integration/v1]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Frontend client against a live API
    runs-on: ubuntu-latest

    # Demo mode throughout: fixture capture, mock AI. No Douyin session, no API key, no
    # sidecar. Verified to work without ffmpeg on PATH as well -- the fixtures carry inline
    # native_subtitle, so the ASR branch never runs.
    env:
      DK_AI_PROVIDER: mock
      DK_CAPTURE_PROVIDER: fixture
      DK_SERVE_FRONTEND: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Build the fixture corpus
        working-directory: backend
        # The probe asserts on real payloads, so it needs a populated database rather than an
        # empty one: an endpoint that returns `[]` satisfies almost any shape check.
        run: |
          set -euo pipefail
          export DK_DATA_DIR="$PWD/ci_data"
          rm -rf "$DK_DATA_DIR"
          python -m douyin_knowledge.cli db upgrade
          python -m douyin_knowledge.cli sync --process --wait | tee /tmp/sync.txt
          grep -qx 'jobs_failed: 0' /tmp/sync.txt || { echo "::error::a processing job failed in demo mode"; exit 1; }

      - name: Probe the API with the real frontend client
        # This is the acceptance check for "the frontend reaches the backend". It imports the
        # frontend's own API client module, so a renamed field or a changed response shape
        # fails here -- which is where every payload-shape bug in this project came from.
        run: |
          set -euo pipefail
          cd backend
          export DK_DATA_DIR="$PWD/ci_data"
          python -m douyin_knowledge.cli serve > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8787/health > /dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8787/health || { echo "::error::API never became healthy"; cat /tmp/server.log; exit 1; }
          cd ../frontend
          npm run probe

      - name: Server log on failure
        if: failure()
        run: cat /tmp/server.log || true

      - name: Stop the API
        if: always()
        run: |
          [ -f /tmp/server.pid ] && kill "$(cat /tmp/server.pid)" 2>/dev/null || true
